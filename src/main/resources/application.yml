spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_safety?createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:campus}
    password: ${MYSQL_PASSWORD:campus}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_safety}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

campus:
  speed-limit-kmh: ${CAMPUS_SPEED_LIMIT_KMH:30}
  gate-distance-meters: ${CAMPUS_GATE_DISTANCE_METERS:300}
  transit-ttl: ${CAMPUS_TRANSIT_TTL:10m}
  noise-threshold-db: ${CAMPUS_NOISE_THRESHOLD_DB:85}
  noise-sustained-duration: ${CAMPUS_NOISE_SUSTAINED_DURATION:3s}
  noise-max-sample-gap: ${CAMPUS_NOISE_MAX_SAMPLE_GAP:2s}
